[package]
name = "dame-python"
description = "Python bindings for the dame draughts engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_core"
# "cdylib" produces the shared library that Python imports.
crate-type = ["cdylib"]

[dependencies]
dame = { workspace = true }
# The `dame` console script runs the command line inside the extension.
dame-cli = { path = "../dame-cli" }
pyo3 = { workspace = true }

[lints]
workspace = true
